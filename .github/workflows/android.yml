name: Build APK (Final Try)
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-20.04  # 用老版本系统，工具链更兼容老项目
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK dependencies
        run: |
          sudo apt update && sudo apt install -y wget unzip lib32stdc++6 lib32z1
          wget https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip -O /tmp/sdk-tools.zip
          mkdir -p ~/android-sdk
          unzip -q /tmp/sdk-tools.zip -d ~/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/tools:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV
          echo "y" | ~/android-sdk/tools/bin/sdkmanager --licenses
          ~/android-sdk/tools/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/
